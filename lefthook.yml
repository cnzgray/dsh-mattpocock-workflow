# 提交前只顺手修暂存文件的格式和 lint，几秒钟跑完；它不是裁决，裁决是本地跑通 `pnpm check`。
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,json,md,yml,yaml}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx}'
      run: pnpm eslint --max-warnings=0 --fix {staged_files}
      stage_fixed: true
