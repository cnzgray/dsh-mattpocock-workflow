# 只负责发布，不跑验证（验证以本地 `pnpm check` 为准，见 docs/adr/0001-engineering-standards.md 第 5 节）。
# 推送 v* 标签时构建并发布到 npm。发布用 npm Trusted Publishing（OIDC），仓库里不存任何 npm token。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publish --no-git-checks
